# ============================================================================
# .github/workflows/publish-docker.yml
# ============================================================================
# Workflow GitHub Actions pour builder et pusher l'image Chatwoot vers GHCR
# À placer dans ton fork à: .github/workflows/publish-docker.yml
# ============================================================================

name: Build and Publish Chatwoot Docker Image

on:
  push:
    branches:
      - develop
      - main
      - master
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:  # Permet de lancer manuellement

env:
  REGISTRY: ghcr.io
  # Le nom de l'image sera: ghcr.io/VOTRE_USERNAME/chatwoot
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    # Permissions requises pour push vers GHCR
    permissions:
      contents: read
      packages: write
      
    steps:
      # 1. Checkout du code avec l'historique git complet
      # IMPORTANT: fetch-depth: 0 est nécessaire pour git rev-parse HEAD
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup Docker Buildx pour le multi-platform build
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Setup QEMU pour build ARM64 (optionnel mais recommandé)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 4. Login vers GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5. Extraire les métadonnées pour les tags Docker
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Tag "latest" sur la branche principale
            type=raw,value=latest,enable={{is_default_branch}}
            # Tag basé sur la branche
            type=ref,event=branch
            # Tag basé sur le PR
            type=ref,event=pr
            # Tags semver pour les releases
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # SHA court pour traçabilité
            type=sha,prefix=sha-

      # 6. Build et Push de l'image Docker
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile  # Ou ./Dockerfile si tu mets le Dockerfile à la racine
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Pour build multi-architecture, décommenter la ligne suivante
          # platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            RAILS_ENV=production
            NODE_VERSION=23.7.0
            PNPM_VERSION=10.2.0

      # 7. (Optionnel) Vérifier l'image buildée
      - name: Inspect image
        if: github.event_name != 'pull_request'
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          docker image inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
